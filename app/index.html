<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="description" content="FreedomDay: earn today, free tomorrow. Know how much to earn each day, never miss an EMI or card bill, and see the day your money sets you free.">
  <title>FreedomDay</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FreedomDay">
  <link rel="stylesheet" href="styles.css">
  <script>
    // apply the saved theme before the page paints (no white flash)
    (function () { var t = "dark"; try { t = localStorage.getItem("wp-theme") || "dark"; } catch (e) {}
      if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t); })();
  </script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="root"><div class="auth-main" style="min-height:100vh"><div class="muted">Loading FreedomDay…</div></div></div>
  <noscript>FreedomDay needs JavaScript switched on.</noscript>
</body>
</html>
